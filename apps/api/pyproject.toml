[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lewis-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "email-validator>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "black>=24.8"]

[tool.black]
line-length = 88
# Alembic migration files are autogenerated artifacts; don't reformat them.
extend-exclude = "alembic/versions/"

[tool.ruff]
line-length = 88
# Alembic migration files are autogenerated artifacts; don't lint them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# B008: FastAPI's dependency-injection pattern requires calling Depends(...)
# as an argument default; this is the framework-idiomatic usage.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["lewis_api*"]
