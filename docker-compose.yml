services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lewis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lewis_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lewis}
    ports:
      - "5432:5432"
    volumes:
      - lewis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lewis}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  lewis_pgdata:
